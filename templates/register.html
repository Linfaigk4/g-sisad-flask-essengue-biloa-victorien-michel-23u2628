{% extends "base.html" %}

{% block title %}Inscription - G-SISAD{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="glassmorphism rounded-2xl p-8 shadow-xl max-w-md w-full">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-[#84CC16] to-[#7C3AED] rounded-2xl mx-auto mb-4 flex items-center justify-center">
                <span class="text-3xl"></span>
            </div>
            <h2 class="text-3xl font-bold text-[#7C3AED]">Inscription</h2>
            <p class="text-gray-600 mt-2">Créez votre compte santé</p>
        </div>
        
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Nom d'utilisateur</label>
                <input type="text" name="username" required 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#84CC16] focus:outline-none focus:ring-2 focus:ring-[#84CC16] transition">
            </div>
            
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#84CC16] focus:outline-none focus:ring-2 focus:ring-[#84CC16] transition">
            </div>
            
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Mot de passe</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#84CC16] focus:outline-none focus:ring-2 focus:ring-[#84CC16] transition">
            </div>
            
            <button type="submit" class="btn-primary w-full text-white py-3 rounded-lg font-semibold hover:shadow-lg transition">
                S'inscrire
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-gray-600">Déjà inscrit ? 
                <a href="{{ url_for('login') }}" class="text-[#84CC16] hover:text-[#65A30D] font-semibold transition">Connexion</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
